<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 188" width="620" height="188" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="620" height="188" fill="#fcfcfb"/>

<text x="310.0" y="22.0" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Where the chunk boundary falls on the same real sentence</text>
<text x="16" y="68.0" font-size="10" fill="#52514e" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">no overlap -- fact split across 2 chunks, never intact</text>
<rect x="16" y="76" width="152.8" height="24" rx="5" fill="#d03b3b"/>
<text x="92.4" y="92.0" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">...the engineer who</text>
<rect x="174.8" y="76" width="188.8" height="24" rx="5" fill="#d03b3b"/>
<text x="269.20000000000005" y="92.0" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">configured it, Ashraf...</text>
<text x="16" y="122.0" font-size="10" fill="#52514e" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">50% overlap -- whole fact lands in 1 chunk</text>
<rect x="16" y="130" width="289.6" height="24" rx="5" fill="#0ca30c"/>
<text x="160.8" y="146.0" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">the engineer who configured it, Ashraf</text>
</svg>