<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 514" width="640" height="514" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="640" height="514" fill="#fcfcfb"/>

<rect x="1" y="1" width="638" height="512" rx="10" fill="#fcfcfb" stroke="#d8d6cd" stroke-width="1.2"/>
<text x="320.0" y="26.0" font-size="14.5" fill="#0b0b0b" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Semantic Memory</text>
<line x1="20" y1="46" x2="620" y2="46" stroke="#e1e0d9" stroke-width="1"/>
<rect x="20" y="60" width="600" height="98" rx="7" fill="#2a78d6" fill-opacity="0.07"/>
<rect x="20" y="60" width="4" height="98" rx="2" fill="#2a78d6"/>
<circle cx="49" cy="87" r="13" fill="#2a78d6"/>
<text x="49" y="87.0" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">1</text>
<text x="72" y="87.0" font-size="11" fill="#52514e" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">WHAT IT IS</text>
<text x="72" y="113.3" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Durable facts an agent has learned about a user or the world, kept outside the</text>
<text x="72" y="130.3" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">context window.</text>
<rect x="20" y="170" width="600" height="98" rx="7" fill="#1baf7a" fill-opacity="0.07"/>
<rect x="20" y="170" width="4" height="98" rx="2" fill="#1baf7a"/>
<circle cx="49" cy="197" r="13" fill="#1baf7a"/>
<text x="49" y="197.0" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">2</text>
<text x="72" y="197.0" font-size="11" fill="#52514e" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">HOW IT DIFFERS</text>
<text x="72" y="223.3" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Not a past event (episodic) and not what&#x27;s in the window now (working) -- a fact</text>
<text x="72" y="240.3" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">stated cold, no trace of when it was learned.</text>
<rect x="20" y="280" width="600" height="98" rx="7" fill="#eda100" fill-opacity="0.07"/>
<rect x="20" y="280" width="4" height="98" rx="2" fill="#eda100"/>
<circle cx="49" cy="307" r="13" fill="#eda100"/>
<text x="49" y="307.0" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">3</text>
<text x="72" y="307.0" font-size="11" fill="#52514e" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">WHERE IT LIVES</text>
<text x="72" y="333.3" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">A fact store outside the context window: key-value pairs, not a transcript. Read</text>
<text x="72" y="350.3" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">back in on demand, any session.</text>
<rect x="20" y="390" width="600" height="98" rx="7" fill="#6250d6" fill-opacity="0.07"/>
<rect x="20" y="390" width="4" height="98" rx="2" fill="#6250d6"/>
<circle cx="49" cy="417" r="13" fill="#6250d6"/>
<text x="49" y="417.0" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">4</text>
<text x="72" y="417.0" font-size="11" fill="#52514e" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">EXAMPLE</text>
<text x="72" y="443.3" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Session 1: user mentions he&#x27;s vegetarian, based in Toronto. Session 2 (new chat):</text>
<text x="72" y="460.3" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">agent answers correctly using only stored facts.</text>
</svg>