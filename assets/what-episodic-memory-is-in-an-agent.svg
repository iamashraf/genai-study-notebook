<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 531" width="640" height="531" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="640" height="531" fill="#fcfcfb"/>

<rect x="1" y="1" width="638" height="529" rx="10" fill="#fcfcfb" stroke="#d8d6cd" stroke-width="1.2"/>
<text x="320.0" y="26.0" font-size="14.5" fill="#0b0b0b" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Episodic Memory</text>
<line x1="20" y1="46" x2="620" y2="46" stroke="#e1e0d9" stroke-width="1"/>
<rect x="20" y="60" width="600" height="98" rx="7" fill="#2a78d6" fill-opacity="0.07"/>
<rect x="20" y="60" width="4" height="98" rx="2" fill="#2a78d6"/>
<circle cx="49" cy="87" r="13" fill="#2a78d6"/>
<text x="49" y="87.0" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">1</text>
<text x="72" y="87.0" font-size="11" fill="#52514e" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">WHAT IT IS</text>
<text x="72" y="113.3" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">A record of one specific past experience: what the agent tried, when, and whether it</text>
<text x="72" y="130.3" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">worked. Not a general fact, and not the current context window.</text>
<rect x="20" y="170" width="600" height="98" rx="7" fill="#1baf7a" fill-opacity="0.07"/>
<rect x="20" y="170" width="4" height="98" rx="2" fill="#1baf7a"/>
<circle cx="49" cy="197" r="13" fill="#1baf7a"/>
<text x="49" y="197.0" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">2</text>
<text x="72" y="197.0" font-size="11" fill="#52514e" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">WHY IT MATTERS</text>
<text x="72" y="223.3" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Lets the agent say &quot;last time I tried X, it failed because Y&quot; and act on that</text>
<text x="72" y="240.3" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">instead of repeating the mistake.</text>
<rect x="20" y="280" width="600" height="98" rx="7" fill="#eda100" fill-opacity="0.07"/>
<rect x="20" y="280" width="4" height="98" rx="2" fill="#eda100"/>
<circle cx="49" cy="307" r="13" fill="#eda100"/>
<text x="49" y="307.0" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">3</text>
<text x="72" y="307.0" font-size="11" fill="#52514e" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">HOW IT&#x27;S RETRIEVED</text>
<text x="72" y="333.3" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Each stored episode gets a recency score, an importance score, and a relevance score</text>
<text x="72" y="350.3" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">against the current situation; the three combine into one retrieval score.</text>
<rect x="20" y="390" width="600" height="115" rx="7" fill="#6250d6" fill-opacity="0.07"/>
<rect x="20" y="390" width="4" height="115" rx="2" fill="#6250d6"/>
<circle cx="49" cy="417" r="13" fill="#6250d6"/>
<text x="49" y="417.0" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">4</text>
<text x="72" y="417.0" font-size="11" fill="#52514e" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">EXAMPLE</text>
<text x="72" y="443.3" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Booking a Saturday venue: an old episode about a venue closed for renovation</text>
<text x="72" y="460.3" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">outranks a more recent Wi-Fi outage, because it scores higher on importance and</text>
<text x="72" y="477.3" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">relevance.</text>
</svg>